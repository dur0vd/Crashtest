name: Восстановление доступа к RoadPDD

on:
  push:
    branches: [fix/roadpdd-connectivity-20261029]
    paths: [.github/workflows/connectivity-recovery.yml]

permissions:
  contents: read

concurrency:
  group: roadpdd-connectivity-recovery
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.DEPLOY_HOST || '45.132.176.226' }}
      SSH_USER: ${{ secrets.DEPLOY_USER || 'user1' }}
    steps:
      - name: Подготовить SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/roadpdd-ssh"
          test -n "$DEPLOY_KEY"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/roadpdd-ssh/key"
          ssh-keyscan -T 15 "$HOST" > "$RUNNER_TEMP/roadpdd-ssh/scanned" 2>/dev/null
          ssh-keygen -lf "$RUNNER_TEMP/roadpdd-ssh/scanned" -E sha256 | grep -F 'SHA256:7E8pLc2UjJmAC350ux1rx1ZPNr0GU0/B9LlB/3xOJnk'
          awk '$2 == "ssh-ed25519"' "$RUNNER_TEMP/roadpdd-ssh/scanned" > "$RUNNER_TEMP/roadpdd-ssh/known_hosts"
          test -s "$RUNNER_TEMP/roadpdd-ssh/known_hosts"
      - name: Проверить сайт локально и разрешить веб-порты в UFW
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/roadpdd-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$RUNNER_TEMP/roadpdd-ssh/known_hosts" -o ConnectTimeout=15 "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Не выводим конфигурацию ВМ, правила сети, ключи и данные пользователей.
          curl -fsS --resolve roadpdd.ru:443:127.0.0.1 --max-time 10 -o /dev/null https://roadpdd.ru/
          echo 'LOCAL_HTTPS_OK'
          if command -v ufw >/dev/null && sudo -n ufw status | grep -q '^Status: active'; then
            backup="/var/backups/roadpdd-firewall-$(date +%Y%m%d-%H%M%S)"
            sudo -n install -d -m 700 "$backup"
            sudo -n tar -czf "$backup/ufw.tar.gz" -C /etc ufw >/dev/null
            # Добавляем только публичные веб-порты. SSH и остальные правила сохраняются.
            sudo -n ufw allow 80/tcp >/dev/null
            sudo -n ufw allow 443/tcp >/dev/null
            echo 'WEB_PORTS_ALLOWED_UFW_BACKUP_SAVED'
          else
            echo 'UFW_NOT_ACTIVE_NO_CHANGES'
          fi
          REMOTE
      - name: Проверить HTTPS извне
        run: |
          set -euo pipefail
          for url in https://roadpdd.ru/ https://www.roadpdd.ru/; do
            curl -fsS --retry 2 --retry-delay 2 --connect-timeout 5 --max-time 10 -o /dev/null -w "$url status=%{http_code} tls=%{ssl_verify_result}\n" "$url"
          done
      - name: Удалить временный ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/roadpdd-ssh/key" "$RUNNER_TEMP/roadpdd-ssh/scanned" "$RUNNER_TEMP/roadpdd-ssh/known_hosts"
