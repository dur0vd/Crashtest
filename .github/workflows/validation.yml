name: Validation

# Downloads open crash-test data (not stored in the repository) and rebuilds
# docs/VALIDATION.md. Scheduled and manual only: it depends on an external API.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      max:
        description: Number of NHTSA tests to download
        default: '150'

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/fetch-validation-data.mjs --max "${{ github.event.inputs.max || '150' }}"
      - run: npm run validation-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: docs/VALIDATION.md
