# Crashtest — статический сайт (PWA). Замените crashtest.ru на ваш домен и путь к сборке.
# Сертификат: certbot --nginx -d crashtest.ru -d www.crashtest.ru

server {
    listen 80;
    listen [::]:80;
    server_name crashtest.ru www.crashtest.ru;
    return 301 https://crashtest.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.crashtest.ru;
    ssl_certificate     /etc/letsencrypt/live/crashtest.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crashtest.ru/privkey.pem;
    return 301 https://crashtest.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crashtest.ru;

    ssl_certificate     /etc/letsencrypt/live/crashtest.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crashtest.ru/privkey.pem;

    root /var/www/crashtest/current;
    index index.html;
    charset utf-8;

    # Журналы без IP-адресов: сайту они не нужны, а это персональные данные.
    log_format noip '[$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/crashtest.log noip;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    types { application/manifest+json webmanifest; }

    # Файлы сборки с хэшем в имени — кэшируются надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Страница, service worker и манифест — всегда свежие, иначе обновления не дойдут до пользователей.
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)?$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
