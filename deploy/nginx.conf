# Crashtest — статический сайт (PWA) на roadpdd.ru. Устанавливается скриптом deploy/setup-server.sh,
# который подставляет домен и путь и получает сертификат Let's Encrypt.

# Журналы без IP-адресов: сайту они не нужны, а это персональные данные.
log_format noip '[$time_local] "$request" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name roadpdd.ru www.roadpdd.ru;
    # Проверка Let's Encrypt при продлении сертификата.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://roadpdd.ru$request_uri; }
}

# www-begin
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.roadpdd.ru;
    ssl_certificate     /etc/letsencrypt/live/roadpdd.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roadpdd.ru/privkey.pem;
    return 301 https://roadpdd.ru$request_uri;
}
# www-end

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roadpdd.ru;

    ssl_certificate     /etc/letsencrypt/live/roadpdd.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roadpdd.ru/privkey.pem;

    root /var/www/roadpdd/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/crashtest.log noip;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # API облачных сцен (server/): Node-процесс слушает только localhost, снаружи — один origin,
    # поэтому CSP connect-src 'self' не меняется. IP клиентов в журнал не попадают (noip).
    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Файлы сборки с хэшем в имени — кэшируются надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Страница, service worker и манифест — всегда свежие, иначе обновления не дойдут до пользователей.
    location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)?$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
