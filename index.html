<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101319" />
    <meta name="description" content="Учебная модель: нарисуйте дорожную ситуацию, задайте движение и посмотрите, какие пункты ПДД и статьи КоАП и УК РФ с ней связаны. Не экспертиза." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Crashtest — симулятор дорожных ситуаций" />
    <meta property="og:description" content="Нарисуйте дорожную ситуацию, задайте движение — и посмотрите учебный разбор по ПДД, КоАП и УК РФ." />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="https://roadpdd.ru/promo/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Crashtest — симулятор дорожных ситуаций</title>
  </head>
  <body>
    <header class="top">
      <div class="brand"><img src="icon.svg" alt="" width="34" height="34" /><div><span>Crashtest</span><small>Дорожная лаборатория</small></div></div>
      <label class="scene-title"><span>Текущая ситуация</span><input id="sceneName" class="name" aria-label="Название ситуации" maxlength="80" /></label>
      <div class="spacer"></div>
      <span class="study-label"><i></i>Учебная модель</span>
      <button id="btnUndo" class="icon" title="Отменить (Ctrl+Z)" aria-label="Отменить">↶</button>
      <button id="btnRedo" class="icon" title="Повторить (Ctrl+Y)" aria-label="Повторить">↷</button>
      <div class="menu">
        <button id="btnExamples" class="btn examples-button" aria-expanded="false" aria-controls="menuExamples"><span>Примеры</span></button>
        <div id="menuExamples" class="dropdown hidden"></div>
      </div>
      <div class="menu">
        <button id="btnMenu" class="icon" aria-label="Меню" aria-expanded="false" aria-controls="menuMain">⋯</button>
        <div id="menuMain" class="dropdown right hidden"></div>
      </div>
    </header>

    <div class="work">
      <nav id="tools" class="tools" aria-label="Инструменты"></nav>

      <section class="stage" id="stage" aria-label="Схема дорожной ситуации">
        <canvas id="cv" aria-label="Холст дорожной ситуации"></canvas>
        <div class="stage-heading"><span class="stage-title">Схема ситуации</span><span id="stageMode" class="stage-mode">Редактирование</span></div>
        <div id="sceneStats" class="scene-stats"></div>
        <div id="palette" class="palette"></div>
        <div id="drawbar" class="drawbar hidden">
          <span id="drawText"></span>
          <button id="btnDone" class="btn primary">Готово</button>
          <button id="btnCancel" class="btn">Отмена</button>
        </div>
        <div id="hint" class="hint"></div>
        <div class="zoom">
          <button id="zoomIn" class="icon" aria-label="Приблизить">+</button>
          <button id="zoomOut" class="icon" aria-label="Отдалить">−</button>
          <button id="zoomFit" class="icon" aria-label="Показать всю сцену" title="Показать всю сцену">⌖</button>
          <button id="zoomFollow" class="icon on" aria-label="Камера следит за участниками" title="Камера следит за участниками">🎥</button>
        </div>
        <div id="toast" class="toast hidden" role="status"></div>
      </section>

      <aside id="side" class="side">
        <div class="inspector-heading"><div><span class="eyebrow">Панель управления</span><h2 id="inspectorTitle">Свойства объекта</h2></div><button id="sheetClose" class="icon only-mobile" aria-label="Свернуть">✕</button></div>
        <div class="tabs" role="tablist" aria-label="Панели редактора">
          <button id="tab-props" class="tab on" data-tab="props" role="tab" aria-selected="true" aria-controls="pane-props">Свойства</button>
          <button id="tab-env" class="tab" data-tab="env" role="tab" aria-selected="false" aria-controls="pane-env" tabindex="-1">Среда</button>
          <button id="tab-report" class="tab" data-tab="report" role="tab" aria-selected="false" aria-controls="pane-report" tabindex="-1">Разбор <i id="repBadge" class="badge hidden"></i></button>
          <button id="tab-ref" class="tab" data-tab="ref" role="tab" aria-selected="false" aria-controls="pane-ref" tabindex="-1">Нормы</button>
        </div>
        <div id="pane-props" class="pane" role="tabpanel" aria-labelledby="tab-props" tabindex="0"></div>
        <div id="pane-env" class="pane hidden" role="tabpanel" aria-labelledby="tab-env" tabindex="0"></div>
        <div id="pane-report" class="pane hidden" role="tabpanel" aria-labelledby="tab-report" tabindex="0"></div>
        <div id="pane-ref" class="pane hidden" role="tabpanel" aria-labelledby="tab-ref" tabindex="0"></div>
        <div class="inspector-foot"><span class="status-dot"></span>Учебный разбор по ПДД РФ</div>
      </aside>
    </div>

    <footer class="player">
      <button id="btnSheet" class="icon only-mobile" aria-label="Панель" aria-expanded="false" aria-controls="side">☰</button>
      <button id="btnRestart" class="icon" title="В начало" aria-label="В начало">⏮</button>
      <button id="btnPlay" class="play" title="Запустить симуляцию" aria-label="Запустить">▶</button>
      <button id="btnEdit" class="btn" title="Вернуться к редактированию">✎ Править</button>
      <div class="timeline"><div class="timeline-heading"><span>Симуляция</span><span id="playbackState">Готова к запуску</span></div><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Время" /></div>
      <span id="timeLabel" class="time-label">0.0 / 20.0 с</span>
      <select id="speed" aria-label="Скорость воспроизведения">
        <option value="0.25">×0.25</option>
        <option value="0.5">×0.5</option>
        <option value="1" selected>×1</option>
        <option value="2">×2</option>
      </select>
    </footer>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <button id="modalClose" class="icon" aria-label="Закрыть">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
